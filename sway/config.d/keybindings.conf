# =============================================================================
# KEYBINDINGS
# Description: All keyboard shortcuts and bindings
# =============================================================================

# =============================================================================
# APPLICATION LAUNCHER BINDINGS
# =============================================================================

# Primary Applications
bindsym $mod+Return exec $app_terminal
bindsym $mod+e exec $app_file_manager
bindsym $mod+c exec $app_browser
bindsym $mod+t exec $app_editor

# UI Launchers
bindsym $mod+r exec $ui_launcher
bindsym $mod+period exec $ui_emoji

# Clipboard Management
bindsym $mod+Shift+c exec wofi 

# =============================================================================
# WINDOW MANAGEMENT BINDINGS
# =============================================================================

# Window Lifecycle
bindsym $mod+q kill
bindsym $mod+Ctrl+q exec swaymsg kill

# Window State
bindsym $mod+Shift+f floating toggle
bindsym $mod+space focus mode_toggle
bindsym $mod+f fullscreen
bindsym $mod+a focus parent

# =============================================================================
# NAVIGATION BINDINGS
# =============================================================================

# Focus Navigation (Vim-style)
bindsym $mod+$direction_left focus left
bindsym $mod+$direction_down focus down
bindsym $mod+$direction_up focus up
bindsym $mod+$direction_right focus right

# Focus Navigation (Arrow Keys)
bindsym $mod+$arrow_left focus left
bindsym $mod+$arrow_down focus down
bindsym $mod+$arrow_up focus up
bindsym $mod+$arrow_right focus right

# Window Movement (Vim-style)
bindsym $mod+Shift+$direction_left move left
bindsym $mod+Shift+$direction_down move down
bindsym $mod+Shift+$direction_up move up
bindsym $mod+Shift+$direction_right move right

# Window Movement (Arrow Keys)
bindsym $mod+Shift+$arrow_left move left
bindsym $mod+Shift+$arrow_down move down
bindsym $mod+Shift+$arrow_up move up
bindsym $mod+Shift+$arrow_right move right

# =============================================================================
# WORKSPACE BINDINGS
# =============================================================================

# Workspace Navigation
bindsym $mod+1 workspace number $ws1
bindsym $mod+2 workspace number $ws2
bindsym $mod+3 workspace number $ws3
bindsym $mod+4 workspace number $ws4
bindsym $mod+5 workspace number $ws5
bindsym $mod+6 workspace number $ws6
bindsym $mod+7 workspace number $ws7
bindsym $mod+8 workspace number $ws8
bindsym $mod+9 workspace number $ws9
bindsym $mod+0 workspace number $ws10

# Container Movement to Workspaces
bindsym $mod+Shift+1 move container to workspace number $ws1
bindsym $mod+Shift+2 move container to workspace number $ws2
bindsym $mod+Shift+3 move container to workspace number $ws3
bindsym $mod+Shift+4 move container to workspace number $ws4
bindsym $mod+Shift+5 move container to workspace number $ws5
bindsym $mod+Shift+6 move container to workspace number $ws6
bindsym $mod+Shift+7 move container to workspace number $ws7
bindsym $mod+Shift+8 move container to workspace number $ws8
bindsym $mod+Shift+9 move container to workspace number $ws9
bindsym $mod+Shift+0 move container to workspace number $ws10

# =============================================================================
# LAYOUT BINDINGS
# =============================================================================

# Split Layout
bindsym $mod+b splith
bindsym $mod+v splitv

# Layout States
bindsym $mod+s layout stacking
bindsym $mod+Alt+w layout tabbed
bindsym $mod+Alt+e layout toggle split

# =============================================================================
# SCRATCHPAD BINDINGS
# =============================================================================

bindsym $mod+Shift+minus move scratchpad
bindsym $mod+minus scratchpad show

# =============================================================================
# SYSTEM CONTROL BINDINGS
# =============================================================================

# Wallpaper Management
bindsym $mod+Shift+w exec bash $script_wallpaper_select
bindsym $mod+Ctrl+w exec bash $script_wallpaper_random

# Configuration Management
bindsym $mod+Shift+r exec bash $script_sway_reload

# Media Capture
bindsym Print exec $sys_screenshot
bindsym $mod+Shift+s exec $sys_area_screenshot
bindsym $mod+Shift+e exec bash $script_record_runner

# Session Management
bindsym $mod+Shift+q exec swaynag -t warning \
    -m 'Do you want to exit Sway? This will end your Wayland session.' \
    -B 'Yes, exit' 'swaymsg exit'

# =============================================================================
# HARDWARE CONTROL BINDINGS
# =============================================================================

# Audio Control
bindsym --locked XF86AudioMute exec $sys_audio_control set-sink-mute @DEFAULT_SINK@ toggle
bindsym --locked XF86AudioLowerVolume exec $sys_audio_control set-sink-volume @DEFAULT_SINK@ -5%
bindsym --locked XF86AudioRaiseVolume exec $sys_audio_control set-sink-volume @DEFAULT_SINK@ +5%
bindsym --locked XF86AudioMicMute exec $sys_audio_control set-source-mute @DEFAULT_SOURCE@ toggle

# Brightness Control
bindsym --locked XF86MonBrightnessDown exec $sys_brightness_control set 5%-
bindsym --locked XF86MonBrightnessUp exec $sys_brightness_control set 5%+
