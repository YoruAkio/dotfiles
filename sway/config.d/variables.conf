# =============================================================================
# CONFIGURATION VARIABLES
# Description: All variables and constants used throughout the configuration
# =============================================================================

# =============================================================================
# SYSTEM CONSTANTS
# =============================================================================

# Modifier Keys
set $mod Mod4
set $terminal_mod Mod1
set $system_mod Mod4+Shift

# Direction Navigation (Vim-style)
set $direction_left h
set $direction_down j
set $direction_up k
set $direction_right l

# Alternative Direction Navigation (Arrow Keys)
set $arrow_left Left
set $arrow_down Down
set $arrow_up Up
set $arrow_right Right

# =============================================================================
# APPLICATION REGISTRY
# =============================================================================

# Core Applications
set $app_terminal kitty
set $app_file_manager thunar
set $app_browser zen-browser
set $app_editor code

# UI Applications
set $ui_launcher wofi
set $ui_emoji wofi-emoji

# System Applications
set $sys_screenshot grim
set $sys_area_screenshot "grimblast --notify --freeze copysave area"
set $sys_audio_control pactl
set $sys_brightness_control brightnessctl

# =============================================================================
# SCRIPT REGISTRY
# =============================================================================

set $script_wallpaper_select ~/.config/sway/scripts/select_wallpaper.sh
set $script_wallpaper_random ~/.config/sway/scripts/random_wall.sh
set $script_wallpaper_startup ~/.config/sway/scripts/set_wall_on_startup.sh
set $script_sway_reload ~/.config/sway/scripts/reload_sway.sh
set $script_record_runner ~/.config/sway/scripts/record_runner.sh

# =============================================================================
# WORKSPACE CONSTANTS
# =============================================================================

set $ws1 "1"
set $ws2 "2"
set $ws3 "3"
set $ws4 "4"
set $ws5 "5"
set $ws6 "6"
set $ws7 "7"
set $ws8 "8"
set $ws9 "9"
set $ws10 "10"

# =============================================================================
# THEME CONSTANTS
# =============================================================================

set $gap_size 10
set $border_width 2
set $border_radius 10
