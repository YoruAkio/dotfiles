# =============================================================================
# APPEARANCE & THEME
# Description: Visual appearance, gaps, borders, and bar configuration
# =============================================================================

# =============================================================================
# WINDOW APPEARANCE
# =============================================================================

# Apply gap and border settings
gaps inner $gap_size
smart_gaps false
default_border pixel $border_width

# =============================================================================
# STATUS BAR CONFIGURATION
# =============================================================================

bar {
    swaybar_command waybar
    position top
    mode dock
    hidden_state hide
    modifier $mod
}
