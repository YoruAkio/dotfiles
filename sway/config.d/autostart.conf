# =============================================================================
# AUTOSTART APPLICATIONS
# Description: Applications that start automatically with Sway
# =============================================================================

# =============================================================================
# PRIMARY INITIALIZATION
# =============================================================================

# Set wallpaper on startup
exec_always bash $script_wallpaper_startup

# =============================================================================
# SYSTEM SERVICES (SINGLETON PATTERN)
# =============================================================================

# Status bar and notifications - ensure only one instance
exec_always {
    # Kill existing instances to prevent duplicates
    killall waybar
    killall dunst; dunst &
}

# =============================================================================
# IDLE MANAGEMENT
# =============================================================================

# Screen locking and power management
exec swayidle -w \
    timeout 300 'swaylock -f -c 000000' \
    timeout 600 'swaymsg "output * dpms off"' \
    resume 'swaymsg "output * dpms on"' \
    before-sleep 'swaylock -f -c 000000'
