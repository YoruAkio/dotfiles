# =============================================================================
# WINDOW RULES
# Description: Window-specific behavior and assignments
# =============================================================================

# =============================================================================
# WINDOW APPEARANCE RULES
# =============================================================================

# Development Applications
for_window [app_id="cursor"] {
    border pixel $border_width
    titlebar off
}

for_window [class="Code|code-oss|Google-chrome|Brave-browser|min"] {
    border pixel $border_width
    titlebar off
}

# =============================================================================
# FLOATING WINDOW RULES
# =============================================================================

# File Manager
for_window [app_id="thunar"] floating enable, resize set 800 600

# Audio Control
for_window [app_id="pavucontrol"] floating enable, resize set 600 400

# Media Windows
for_window [title="Picture-in-Picture"] floating enable, sticky enable

# =============================================================================
# WORKSPACE ASSIGNMENTS
# =============================================================================

# Web Browser
assign [app_id="zen-browser"] workspace number $ws1

# Code Editor
assign [class="Code"] workspace number $ws2

# File Manager
assign [app_id="thunar"] workspace number $ws3

# Communication
assign [class="discord"] workspace number $ws4

# Media
assign [class="Spotify"] workspace number $ws5
