# =============================================================================
# RESIZE MODE
# Description: Window resizing mode and bindings
# =============================================================================

# =============================================================================
# RESIZE MODE DEFINITION
# =============================================================================

mode "resize" {
    # Resize with Vim-style keys
    bindsym $direction_left resize shrink width 10px
    bindsym $direction_down resize grow height 10px
    bindsym $direction_up resize shrink height 10px
    bindsym $direction_right resize grow width 10px

    # Resize with Arrow keys
    bindsym $arrow_left resize shrink width 10px
    bindsym $arrow_down resize grow height 10px
    bindsym $arrow_up resize shrink height 10px
    bindsym $arrow_right resize grow width 10px

    # Precise resize (1px increments)
    bindsym Shift+$direction_left resize shrink width 1px
    bindsym Shift+$direction_down resize grow height 1px
    bindsym Shift+$direction_up resize shrink height 1px
    bindsym Shift+$direction_right resize grow width 1px

    # Exit resize mode
    bindsym Return mode "default"
    bindsym Escape mode "default"
    bindsym $mod+Alt+r mode "default"
}

# =============================================================================
# RESIZE MODE ACTIVATION
# =============================================================================

bindsym $mod+Alt+r mode "resize"
